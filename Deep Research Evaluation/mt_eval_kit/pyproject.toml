[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mt-eval-kit"
version = "1.0.0"
description = "Standalone pointwise (6-factor) + pairwise evaluator for CTI deep-research reports from any set of LLMs."
readme = "INTEGRATION.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6", "pyyaml>=6.0", "tenacity>=8.2"]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.39"]
gemini = ["google-generativeai>=0.7"]
ollama = ["httpx>=0.27"]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
mt-evaluate = "evaluate:main"
mt-adapt = "mightytoaster_adapter:main"

[tool.setuptools]
py-modules = ["evaluate", "orchestrator", "mightytoaster_adapter"]
packages = ["judges", "llm", "models", "prompts", "exporters"]

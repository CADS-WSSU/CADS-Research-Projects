# TREC 2026 Change Detection — local baseline configuration.
# All thresholds, model names, and the provider setting live here so the day loop,
# scorers, and output code never hard-code a value. (Plan: cross-cutting requirement.)

[run]
runtag = "ncsu-local-base"      # <=20 chars, pattern ^[a-zA-Z0-9_-][a-zA-Z0-9_.-]{1,20}$
description = "Local LLM-free baseline: hybrid BM25+bge-small dense retrieval, classical novelty (memory cosine + new terms + new entities), metric-aware fire/truncate policy tuned to truncated ranking metrics."
run_type = "automatic"
extern = "Local models only, no external corpora. Embeddings: BAAI/bge-small-en-v1.5 (sentence-transformers) on Apple MPS. NER: spaCy en_core_web_sm. Lexical: rank-bm25 (Okapi BM25) over each day's documents. No generative model is used in this baseline."

[server]
base_url = "http://127.0.0.1:8000"
api_key = "abc123"

[relevance]
# method = "reranker" (default): bi-encoder cosine pre-filters the day's docs to the
#   top prefilter_n, then a local cross-encoder reranker scores chunked passages; the
#   max reranker probability is the relevance signal the threshold gates on. Diagnostics
#   showed bi-encoder cosine alone cannot separate relevant from nil days; the reranker
#   collapses nil-day false-fires from ~82% to ~3-5%.
# method = "hybrid": the older bi-encoder cosine + BM25 scorer (kept for comparison).
method = "reranker"
model = "BAAI/bge-small-en-v1.5"        # bi-encoder (embeddings + cosine pre-filter)
device = "mps"
dense_weight = 0.6                      # hybrid-only: rank_blend = dense_weight*cos + (1-dense_weight)*bm25
batch_size = 64

# reranker (method = "reranker")
reranker_model = "BAAI/bge-reranker-v2-m3"
prefilter_n = 20                        # rerank only the top-N cosine candidates (relevant docs are ~89% in top-10)
chunk_chars = 1800                      # passage length for chunked reranking
chunk_overlap = 300
max_chunks = 3                          # cap chunks per doc to bound cost
threshold = 0.10                        # primary reranker bar: a doc clearing this is always a candidate
query_enrich = "none"                   # none | narrative (narrative blurred per-question relevance — kept off)
# rank-aware ensemble: ALSO admit a top-cosine doc with a moderate reranker score.
ensemble_cos_rank = 3                   # only docs in the day's top-K by cosine qualify for the moderate path (0 disables)
ensemble_min_prob = 0.05                # moderate reranker bar for the top-cosine ensemble path

[novelty]
# novelty = w_cos*(1 - max_cosine_to_memory) + w_terms*frac_new_terms + w_ents*frac_new_entities
w_cos = 0.5
w_terms = 0.25
w_ents = 0.25
threshold = 0.5                 # min novelty to accept a doc as a genuine update (tuned in M6)
spacy_model = "en_core_web_sm"
# novelty A/B levers (default OFF = baseline). A=as_signal (additive, no cap); B=zcalib
# (per-question z-scored novelty). Toggle per-run via score_gold_task --nov-signal/--nov-zcalib.
as_signal = true                # A: ADOPTED (additive novelty, never demotes; +0.0025 doc has-ans AP')
zcalib = false                  # B: rejected (0.00000 effect)
boost = 2.0
z_thr = 0.0
z_min_bg = 8

[policy]
# Combined score = combine_rel*relevance + combine_nov*novelty
combine_rel = 0.5
combine_nov = 0.5
combined_threshold = 0.5        # truncate each doc-ranking where combined score drops below this
max_docs_per_question = 100     # hard cap from the toolkit; policy truncates well before this
novelty_top_k = 50              # only score novelty on the top-K relevance candidates (bounds cost; deeper docs are never reported)

[paths]
docs_db = "docs.db"
embeddings_cache = "embeddings_cache"
state_dir = "state"             # token + per-question memory for resumability

[llm]
# Reserved for Milestone 7 only. Baseline must run with enabled = false.
enabled = false
provider = "ollama"             # ollama | api
model = ""
